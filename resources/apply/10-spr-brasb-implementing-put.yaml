apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: spr-brasb-implementing-put
spec:
  title: "Implementing PUT"
  description: "Implementing PUT"
  workshop:
    image: jdk17-environment:*
    packages:
      - name: spring-academy-lab
        files:
          - image:
              url:
                ghcr.io/spring-academy/spring-academy-extension-packages/spring-academy-lab
              tagSelection:
                semver:
                  constraints: ">=1.0.0 <2.0.0"
    files:
      - http:
          url: "$(ingress_protocol)://$(workshop_namespace)-files.$(ingress_domain)/$(workshop_name).tar.gz"
      - path: .local/share/code-server
        image:
          url: ghcr.io/spring-academy/vscode-java-tools-$(platform_arch)-files:0.25.14
  request:
    parameters:
    - name: USER_DOMAIN
      value: "unknown.domain"
    - name: USER_EMAIL
      value: "somebody@unknown.domain"
  session:
    env:
      - name: LESSON_LABEL
        value: implement-put-start
    namespaces:
      budget: medium
    applications:
      terminal:
        enabled: true
        layout: default
      editor:
        enabled: true
    dashboards:
      - name: Editor
      - name: Terminal
    resources:
      memory: 2Gi
    volumes:
    - name: workshop-setup-scripts
      secret:
        secretName: workshop-setup-scripts
        defaultMode: 0755
    volumeMounts:
    - name: workshop-setup-scripts
      mountPath: /opt/packages/workshop-setup-scripts/setup.d

  environment:
    objects:
    - apiVersion: v1
      kind: Secret
      metadata:
        name: workshop-setup-scripts
      stringData:
        00-setup.sh: |
          #!/bin/bash
          # This is run at session creation
          curl -L ${WEBSERVER}/exercises.tar.gz | tar -xvz -C ${HOME}
    - apiVersion: v1
      kind: Service
      metadata:
        name: $(workshop_namespace)-files
        namespace: $(workshop_namespace)
      spec:
        type: ClusterIP
        ports:
        - port: 80
          protocol: TCP
          targetPort: 8080
        selector:
          deployment: files
    - apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: $(workshop_namespace)-files
        namespace: $(workshop_namespace)
      spec:
        tls:
        - hosts:
            - $(workshop_namespace)-files.$(ingress_domain)
          secretName: $(ingress_secret)
        rules:
        - host: $(workshop_namespace)-files.$(ingress_domain)
          http:
            paths:
            - backend:
                service:
                  name: $(workshop_namespace)-files
                  port:
                    number: 80
              pathType: Prefix
              path: /
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: $(workshop_namespace)-files
        namespace: $(workshop_namespace)
      spec:
        serviceAccountName: $(service_account)
        replicas: 1
        selector:
          matchLabels:
            deployment: files
        strategy:
          type: Recreate
        template:
          metadata:
            labels:
              deployment: files
          spec:
            containers:
            - name: files
              image: ${CONTAINER_REGISTRY}${CONTAINER_REPOSITORY}:${VERSION}
