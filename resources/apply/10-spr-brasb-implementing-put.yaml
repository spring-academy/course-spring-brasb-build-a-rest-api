apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: spr-brasb-implementing-put
spec:
  title: "Implementing PUT"
  description: "Implementing PUT"
  workshop:
    image: jdk17-environment:*
    files:
      - http:
          url: "$(ingress_protocol)://$(workshop_namespace)-files.$(ingress_domain)/$(workshop_name).tar.gz"
      - path: .local/share/code-server
        image:
          url: ghcr.io/spring-academy/vscode-java-tools-$(platform_arch)-files:0.25.14
  request:
    parameters:
    - name: USER_DOMAIN
      value: "unknown.domain"
    - name: USER_EMAIL
      value: "somebody@unknown.domain"
  session:
    env:
      - name: WEBSERVER
        value: "$(ingress_protocol)://$(workshop_namespace)-files.$(ingress_domain)"
      - name: LESSON_LABEL
        value: implement-put-start
    namespaces:
      budget: medium
    applications:
      terminal:
        enabled: true
        layout: default
      editor:
        enabled: true
    dashboards:
      - name: Editor
      - name: Terminal
    resources:
      memory: 2Gi
    volumes:
    - name: workshop-setup-scripts
      secret:
        secretName: workshop-setup-scripts
        defaultMode: 0755
    volumeMounts:
    - name: workshop-setup-scripts
      mountPath: /opt/packages/workshop-setup-scripts/setup.d

  environment:
    objects:
    - apiVersion: v1
      kind: Secret
      metadata:
        name: workshop-setup-scripts
      stringData:
        00-setup.sh: |
          #!/bin/bash
          # This is run at session creation
          set -e

          curl -L ${WEBSERVER}/exercises.tar.gz | tar -xvz -C ${HOME}

          # Stage the codebase
          # This script is used to checkout the codebase to the commit that corresponds to the lesson label from the commit message.

          # Note this file is meant to generalize the staging of the codebase via a provided LESSON_LABEL environment variable.
          # there are no explicit parameters for this script to maximize the decoupling of the lesson content from the staging script.

          # Env vars:
          # LESSON_LABEL: Label to search for in commits. Must be surrounded by <> in the commit message to match
          # LESSON_REPO_DIR: Location of the codebase repo, if not in ~/exercises

          get_sha_for_lesson_label() {
            git log --format=format:%H --grep "<$LESSON_LABEL>"
          }

          checkout_to_label() {
            lesson_sha=$(get_sha_for_lesson_label)
            if [[ -z "$lesson_sha" ]]; then
              echo "LESSON_LABEL '$LESSON_LABEL' has no matching commit for this workshop."
            else
              echo "Checking out from git. Label (Git commit containing text): <$LESSON_LABEL>, SHA: $lesson_sha"
              git checkout $lesson_sha
            fi
          }

          # Make sure we are in the root of the repo
          LESSON_REPO_DIR="${LESSON_REPO_DIR:-$HOME/exercises}"

          if [[ ! -d "$LESSON_REPO_DIR" ]]; then
            echo "No codebase at $LESSON_REPO_DIR. Exiting without error."
            exit 0
          fi

          if [[ -z "$LESSON_LABEL" ]]; then
            echo "No lesson label provided. Exiting without error."
            exit 0
          fi

          cd "$LESSON_REPO_DIR"
          checkout_to_label
    - apiVersion: v1
      kind: Service
      metadata:
        name: $(workshop_namespace)-files
        namespace: $(workshop_namespace)
      spec:
        type: ClusterIP
        ports:
        - port: 80
          protocol: TCP
          targetPort: 8080
        selector:
          deployment: files
    - apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: $(workshop_namespace)-files
        namespace: $(workshop_namespace)
      spec:
        tls:
        - hosts:
            - $(workshop_namespace)-files.$(ingress_domain)
          secretName: $(ingress_secret)
        rules:
        - host: $(workshop_namespace)-files.$(ingress_domain)
          http:
            paths:
            - backend:
                service:
                  name: $(workshop_namespace)-files
                  port:
                    number: 80
              pathType: Prefix
              path: /
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: $(workshop_namespace)-files
        namespace: $(workshop_namespace)
      spec:
        serviceAccountName: $(service_account)
        replicas: 1
        selector:
          matchLabels:
            deployment: files
        strategy:
          type: Recreate
        template:
          metadata:
            labels:
              deployment: files
          spec:
            containers:
            - name: files
              image: ${CONTAINER_REGISTRY}${CONTAINER_REPOSITORY}:${VERSION}
