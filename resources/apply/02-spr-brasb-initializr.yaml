apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: spr-brasb-initializr
spec:
  title: Spring Initializr
  description: "Create a new project for the REST API Family Cash Card with the Spring Initializr. "
  workshop:
    image: jdk17-environment:*
    files:
      - http:
          url: "$(ingress_protocol)://$(workshop_namespace)-files.$(ingress_domain)/$(workshop_name).tar.gz"
      - path: .local/share/code-server
        image:
          url: ghcr.io/spring-academy/vscode-java-tools-$(platform_arch)-files:0.25.14
  request:
    parameters:
    - name: USER_DOMAIN
      value: "unknown.domain"
    - name: USER_EMAIL
      value: "somebody@unknown.domain"
  session:
    env:
      - name: WEBSERVER
        value: "$(ingress_protocol)://$(workshop_namespace)-files.$(ingress_domain)"
    namespaces:
      budget: medium
    resources:
      memory: 3Gi
    applications:
      terminal:
        enabled: true
        layout: default
      editor:
        enabled: true
    dashboards:
      - name: Spring Initializr
        url: "$(ingress_protocol)://initializr-$(session_namespace).$(ingress_domain)"
    ingresses:
      - name: initializr
        protocol: http
        host: initializr.$(workshop_namespace).svc.cluster.local
        port: 8080
  environment:
    objects:
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: initializr
          labels:
            app: initializr
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: initializr
          template:
            metadata:
              labels:
                app: initializr
            spec:
              containers:
                - name: dashboard
                  image: ghcr.io/vmware-tanzu-labs/educates-spring-initializr:2.0
                  imagePullPolicy: IfNotPresent
                  ports:
                    - name: 8080-tcp
                      containerPort: 8080
                      protocol: TCP
      - apiVersion: v1
        kind: Service
        metadata:
          name: initializr
          labels:
            app: initializr
        spec:
          type: ClusterIP
          selector:
            app: initializr
          ports:
            - name: 8080-tcp
              port: 8080
              targetPort: 8080
              protocol: TCP
      - apiVersion: v1
        kind: Service
        metadata:
          name: $(workshop_namespace)-files
          namespace: $(workshop_namespace)
        spec:
          type: ClusterIP
          ports:
          - port: 80
            protocol: TCP
            targetPort: 8080
          selector:
            deployment: files
      - apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: $(workshop_namespace)-files
          namespace: $(workshop_namespace)
        spec:
          tls:
          - hosts:
              - $(workshop_namespace)-files.$(ingress_domain)
            secretName: $(ingress_secret)
          rules:
          - host: $(workshop_namespace)-files.$(ingress_domain)
            http:
              paths:
              - backend:
                  service:
                    name: $(workshop_namespace)-files
                    port:
                      number: 80
                pathType: Prefix
                path: /
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: $(workshop_namespace)-files
          namespace: $(workshop_namespace)
        spec:
          serviceAccountName: $(service_account)
          replicas: 1
          selector:
            matchLabels:
              deployment: files
          strategy:
            type: Recreate
          template:
            metadata:
              labels:
                deployment: files
            spec:
              containers:
              - name: files
                image: ${CONTAINER_REGISTRY}${CONTAINER_REPOSITORY}:${VERSION}
